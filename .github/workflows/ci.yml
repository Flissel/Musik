name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CPAL bindet unter Linux gegen ALSA.
      - name: ALSA-Header installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # Das Freigabe-Gatter ist Python und braucht keine laufende Anlage —
      # geprüft wird das Gatter, nicht die Anwendung. Ohne diesen Schritt wären
      # seine Wächter Dekoration: Sie liefen nur, wenn jemand daran denkt.
      - name: Freigabe-Gatter
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q mcp/test_freigabe.py
