[project]
name = "musik-mcp"
version = "0.1.0"
description = "MCP-Brücke zur DJ-Anlage (stdio) — der Steuerraum als Werkzeuge"
requires-python = ">=3.11"

# Nicht `mcp` allein: In 2.x heißt FastMCP MCPServer, und ein ungepinntes
# `mcp` bricht darum bei der nächsten Installation. `server.py` kommt über
# eine Weiche mit beiden zurecht — die Spanne hier sagt, welche geprüft sind.
dependencies = ["mcp>=1.9,<3", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
musik-mcp = "musik.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
